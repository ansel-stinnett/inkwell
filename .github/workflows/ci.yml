# .github/workflows/ci.yml
#
# The full testing pyramid, run automatically: dependency audit, unit and
# integration tests, component tests, end-to-end tests, and a tagged
# deployment artifact. build-check.yml keeps running alongside it.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # Least privilege: every job may read the code and nothing more, unless
  # it asks for more itself (see prepare-deployment-artifact).

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Audit server dependencies
        run: npm audit --audit-level=high
        working-directory: server
      - name: Audit client dependencies
        run: npm audit --audit-level=high
        working-directory: client

  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell
          POSTGRES_DB: inkwell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inkwell:inkwell@localhost:5432/inkwell_test
      # Set once for the whole job. prisma7.config.ts refuses to run without
      # DATABASE_URL, and the tests need it to reach the database above.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Generate the Prisma client
        # npm ci does not generate it; without this step every test that
        # touches the database fails with "Cannot find module
        # '.prisma/client/default'".
        working-directory: server
        run: npx prisma generate
      - name: Apply database migrations
        working-directory: server
        run: npx prisma migrate deploy
      - name: Write the test env file
        # npm test passes --env-file=.env.test to Node, and .env.test is
        # gitignored, so it does not exist on a fresh runner. Node fails
        # outright on a missing env file rather than ignoring it.
        working-directory: server
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.test
      - name: Run tests with coverage
        # npm test keeps the --experimental-vm-modules and --runInBand flags
        # this project needs; everything after "--" is passed on to Jest.
        working-directory: server
        run: npm test -- --coverage
      - name: Upload the coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: server/coverage/

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Run component tests
        working-directory: client
        run: npx vitest run
      - name: Build the production bundle
        working-directory: client
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    # The slowest layer only runs once the fast layers pass, so an obviously
    # broken change fails without waiting for the full browser suite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inkwell
          POSTGRES_PASSWORD: inkwell
          POSTGRES_DB: inkwell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://inkwell:inkwell@localhost:5432/inkwell_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install dependencies (Playwright, server, client)
        # playwright.config.js starts the real server and client with
        # "npm run dev", so all three workspaces need their own installs.
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client
      - name: Prepare the server and its database
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
        # The dev script loads .env, which is never committed, so CI writes a
        # throwaway one holding only the test database's URL.
      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        # Chromium only on every pull request: fast, and it keeps the
        # publish-flow test's sign-ups under the auth rate limit of 5 per 10
        # minutes per IP. Firefox and WebKit belong in a scheduled run.
        run: npx playwright test --project=chromium
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/

  prepare-deployment-artifact:
    runs-on: ubuntu-latest
    needs: [dependency-audit, server-tests, client-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Builds, tags and publishes the image — it does not deploy it.
    # Deploying is Continuous Delivery's separate decision (Lecture 21).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, tag and push the image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inkwell-server:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./server
          docker push "$IMAGE"
        # ${VAR,,} lowercases the owner: image names must be lowercase, but
        # GitHub usernames need not be. Pushed once, by tag, never rebuilt
        # downstream — Lecture 21's CD workflow retrieves this exact image.
