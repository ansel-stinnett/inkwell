# .github/workflows/build-check.yml
#
# Intentionally narrow in scope: confirm the Docker image still builds.
# Lecture 20 expands this.

name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Least privilege: this workflow only reads code, so its token cannot
  # push commits or edit issues even if a step were compromised.

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Build the server Docker image
        run: docker build -t inkwell-server:ci ./server

      - name: Confirm the image was built
        run: docker image inspect inkwell-server:ci --format 'Built {{.Id}} ({{.Architecture}}, {{.Size}} bytes)'
        # inspect exits non-zero if the image is missing, so this genuinely
        # fails when the build produced nothing. "docker images" would print
        # an empty table and still report success.
