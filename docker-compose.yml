# docker-compose.yml
#
# Server, database, network, and persistent storage defined in one
# reviewable, version-controlled file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inkwell
      POSTGRES_PASSWORD: inkwell
      POSTGRES_DB: inkwell_dev
    ports:
      - "5433:5432"
      # Host port 5433 because this machine runs a native PostgreSQL on
      # 5432. The server service does not use this mapping — it reaches
      # db:5432 over Docker's internal network. The mapping only lets host
      # tools connect: psql -h localhost -p 5433
    volumes:
      - inkwell_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwell -d inkwell_dev"]
      interval: 2s
      timeout: 5s
      retries: 15

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://inkwell:inkwell@db:5432/inkwell_dev
      # "db" is the service name, resolved by Compose's internal DNS.
      #
      # server/.env is excluded by .dockerignore, so secrets arrive at
      # runtime. Compose reads them from the root .env; :? stops startup
      # if either is missing.
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      # Waits for the health check, not just container start. The
      # entrypoint's retry loop is a second layer of protection.

volumes:
  inkwell_db_data:
